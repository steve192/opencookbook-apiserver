# English words for the language-neutral units and states. See de.yaml for how they are matched.
language: en

units:
  gram: [g, gram, grams, gramme, grammes]
  kilogram: [kg, kilo, kilos, kilogram, kilograms]
  milligram: [mg, milligram, milligrams]
  ounce: [oz, oz., ounce, ounces]
  pound: [lb, lb., lbs, pound, pounds]
  millilitre: [ml, millilitre, millilitres, milliliter, milliliters]
  centilitre: [cl, centilitre, centiliter]
  decilitre: [dl, decilitre, deciliter]
  litre: [l, litre, litres, liter, liters]
  tablespoon: [tbsp, tbsp., tbs, tablespoon, tablespoons]
  tablespoon-level: [level tablespoon, level tbsp]
  tablespoon-heaped: [heaped tablespoon, heaping tablespoon, heaped tbsp]
  teaspoon: [tsp, tsp., teaspoon, teaspoons]
  teaspoon-level: [level teaspoon, level tsp]
  teaspoon-heaped: [heaped teaspoon, heaping teaspoon, heaped tsp]
  cup-us: [cup, cups, c.]
  fluid-ounce: [fl oz, fl. oz., fluid ounce, fluid ounces]
  pint-us: [pint, pints, pt]
  shot: [shot, shots]

  piece: [piece, pieces, pc, pcs, whole]
  piece-small: [small]
  piece-medium: [medium]
  piece-large: [large, big]
  piece-half: [half]
  clove: [clove, cloves]
  bunch: [bunch, bunches]
  slice: [slice, slices]
  slice-thick: [thick slice, thick slices]
  slice-thin: [thin slice, thin slices]
  leaf: [leaf, leaves]
  sprig: [sprig, sprigs]
  stalk: [stalk, stalks, stick of celery]
  head: [head, heads]
  bulb: [bulb, bulbs]
  root: [root, roots]
  can: [can, cans, tin, tins]
  jar: [jar, jars]
  bottle: [bottle, bottles]
  container: [container, containers, tub, tubs, carton, cartons]
  pack: [pack, packs, package, packages, packet, packets]
  bag: [bag, bags]
  cube: [cube, cubes]
  bar: [bar, bars, stick, sticks]
  roll: [roll, rolls]
  sheet: [sheet, sheets]
  tube: [tube, tubes]
  pot: [pot, pots]
  wedge: [wedge, wedges]
  ball: [ball, balls]
  ring: [ring, rings]
  rib: [rib, ribs]
  strip: [strip, strips]
  tablet: [tablet, tablets]
  portion: [portion, portions, serving, servings]
  pair: [pair, pairs]
  handful: [handful, handfuls]
  grains: [grains]
  centimetre: [cm, centimetre, centimetres, centimeter, centimeters]
  inch: [inch, inches, in.]

  pinch: [pinch, pinches]
  dash: [dash, dashes]
  splash: [splash, splashes]
  drop: [drop, drops]

  to-taste: [to taste, some, as needed, optional]

states:
  RAW: [raw, uncooked]
  BOILED: [boiled, cooked, poached, blanched, simmered]
  STEAMED: [steamed, braised, pressure-steamed]
  STEWED: [stewed]
  BAKED: [baked, roasted, oven-baked]
  GRILLED: [grilled, broiled, toasted]
  PAN_FRIED: [fried, pan-fried, sauteed, sautéed]
  DEEP_FRIED: [deep-fried]
  DRIED: [dried, dehydrated, sun-dried]
  POWDERED: [powder, powdered]
  CONCENTRATED: [concentrate, concentrated]
  CANNED: [canned, tinned]
  PICKLED: [pickled]
  SMOKED: [smoked]
  REDUCED_FAT: [low-fat, lowfat, reduced-fat, skim, skimmed, light, lite, nonfat]
  SWEETENED: [sweetened, sugared]

# Phrases that say how something was prepared without being a preparation of their own.
preparationContext: [without fat, with fat, pan, oven, microwave, in fat]

# Phrases saying an ingredient is used only a little, so that a missing amount changes next to nothing.
sparingUses: [for the pan, for the tin, for greasing, for dusting, for sprinkling, for garnish, to garnish, for decoration,
  for the work surface, for rolling out]
