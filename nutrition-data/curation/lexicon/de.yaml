# German words for units and states.
# Unit words: whole words, case-insensitive; must cover every unit the app offers and importers recognise.
# State words are stemmed like typed names: list inflected forms only where stemming misses them.
language: de

units:
  gram: [g, gr, gr., Gramm]
  kilogram: [kg, Kilo, Kilogramm]
  milligram: [mg, Milligramm]
  millilitre: [ml, Milliliter]
  centilitre: [cl, Zentiliter]
  decilitre: [dl, Deziliter]
  litre: [l, Liter]
  tablespoon: [EL, Essl., Esslöffel]
  tablespoon-level: [EL gestr., EL gestrichen, gestr. EL]
  tablespoon-heaped: [EL gehäuft, gehäufter EL]
  teaspoon: [TL, Teel., Teelöffel]
  teaspoon-level: [TL gestr., TL gestrichen, gestr. TL]
  teaspoon-heaped: [TL gehäuft, gehäufter TL]
  cup-metric: [Tasse, Tasse/n, Tassen]
  shot: [Schuss]

  piece: [Stück, Stück(e), Stücke, Stk, Stk., St., Teil/e, Stick(s)]
  piece-small: [kl. Stück(e), kleine, kleiner, kleines, kleinen, dünne]
  piece-medium: [m.-große, m.-großer, m.-großes, mittelgroße, mittelgroßer, mittelgroßes]
  piece-large: [gr. Stück(e), große, großen, großer, großes, dicke]
  piece-half: [halbe]
  clove: [Zehe, Zehe/n, Zehen]
  bunch: [Bund, Bündel, Rispe(n)]
  bunch-small: [kl. Bund]
  slice: [Scheibe, Scheibe/n, Scheiben]
  slice-thick: [gr. Scheibe(n)]
  slice-thin: [kl. Scheibe(n)]
  leaf: [Blatt, Blätter]
  sprig: [Zweig, Zweig/e, Zweige, Stängel, Stiel/e, Stiele, einige Stiele]
  stalk: [Stange, Stange/n, Stangen, kl. Stange(n), Halm(e)]
  head: [Kopf, Köpfe, Staude(n)]
  head-small: [kl. Kopf]
  head-large: [gr. Kopf]
  bulb: [Knolle, Knolle/n]
  root: [Wurzel, Wurzel/n]
  can: [Dose, Dose/n, Dosen]
  can-small: [kl. Dose/n]
  can-large: [gr. Dose/n]
  jar: [Glas, Gläser]
  jar-small: [kl. Glas, kl. Gläser]
  jar-large: [gr. Glas, gr. Gläser]
  bottle: [Flasche, Flaschen]
  bottle-small: [kl. Flasche/n, Fläschchen]
  bottle-large: [gr. Flasche(n)]
  container: [Becher, Schälchen, Eimer, Fässchen]
  pack: [Pck., Pkt., Paket, Päckchen, Packung, Kästchen, Beet/e]
  bag: [Beutel, Tüte/n]
  cube: [Würfel]
  bar: [Tafel, Tafeln, Riegel]
  roll: [Rolle(n)]
  sheet: [Platte/n, Blatt Teig]
  tube: [Tube/n]
  pot: [Topf]
  wedge: [Ecke(n)]
  ball: [Kugel, Kugel/n, Kugeln]
  ring: [Ring/e]
  rib: [Rippe/n]
  strip: [Streifen]
  tablet: [Tablette(n)]
  portion: [Port., Portion, Portionen]
  pair: [Paar]
  handful: [Handvoll, Hand voll]
  grains: [Körner]
  centimetre: [cm]

  pinch: [Prise, Prise(n), Prisen]
  knife-tip: [Msp., Messerspitze]
  splash: [Spritzer]
  drop: [Tropfen]

  to-taste: [etwas, n. B., nach Belieben, nach Geschmack, einige, viel, wenig, evtl., extra, mehr, Prozent %]

states:
  RAW: [roh]
  BOILED: [gekocht, pochiert, blanchiert, abgekocht, hartgekocht, weichgekocht]
  STEAMED: [gedämpft, druckgedämpft, geschmort]
  STEWED: [gedünstet]
  BAKED: [gebacken, überbacken, geröstet]
  GRILLED: [gegrillt, getoastet]
  PAN_FRIED: [gebraten, angebraten]
  DEEP_FRIED: [frittiert, ausgebacken]
  DRIED: [getrocknet, gedörrt, Trockenprodukt]
  POWDERED: [Pulver, pulverisiert]
  CONCENTRATED: [konzentriert, Konzentrat]
  CANNED: [Konserve, eingedost, Dose, Dosen]
  PICKLED: [eingelegt]
  SMOKED: [geräuchert]
  REDUCED_FAT: [fettarm, fettreduziert, entrahmt, light]
  SWEETENED: [gezuckert, gesüßt]

# Phrases that say how something was prepared without being a preparation of their own.
preparationContext: [ohne Fett, mit Fett, Pfanne, Ofen, Mikrowelle, in Fett]

# Phrases saying an ingredient is used only a little, so that a missing amount changes next to nothing:
# "Mehl für die Form", "Puderzucker zum Bestäuben". Not "zum Braten": frying fat counts.
sparingUses: [für die Form, für die Formen, zum Einfetten, zum Bestäuben, zum Bestreuen, zum Garnieren, zum Dekorieren,
  zur Deko, für die Arbeitsfläche, zum Ausrollen, zur Teigverarbeitung]
