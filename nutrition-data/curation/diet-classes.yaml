# Which foods are animal: VEGAN, VEGETARIAN or MEAT. See scripts/cookpal_nutrition/catalogue/diets.py.
#
# The group letter decides. A name that disagrees with its group is only nominated for review, and
# an unanswered nomination fails the build - patterns are wrong too often to be allowed to decide
# ("Wildreis", "Fondant", "Erdnussbutter", "Honigmelone", "alkoholfrei", "Vegetarische Bratwurst").
# Variants inherit from their base; list one here only where a preparation really differs.

# BLS group letters. A group left out has no default, so every one of its foods needs an override.
groupDefaults:
  U: MEAT          # Fleisch
  V: MEAT          # Geflügel, Wild, Innereien
  W: MEAT          # Wurst- und Fleischerzeugnisse
  T: MEAT          # Fisch und Meerestiere - counted as meat, see diets.py
  M: VEGETARIAN    # Milch, Milchprodukte, Käse
  E: VEGETARIAN    # Eier, Eiprodukte, Teigwaren
  D: VEGETARIAN    # Backwaren, Kuchen, Kekse - egg and milk far more often than not
  S: VEGETARIAN    # Zucker, Süßwaren, Speiseeis
  B: VEGAN         # Brot und Brötchen
  C: VEGAN         # Getreide, Mehl, Reis, Teigwaren
  F: VEGAN         # Obst und Fruchtsäfte
  G: VEGAN         # Gemüse, Kräuter, Pilze
  H: VEGAN         # Hülsenfrüchte, Nüsse, Ölsaaten, Pflanzendrinks
  K: VEGAN         # Kartoffeln und Stärkeerzeugnisse
  N: VEGAN         # Alkoholfreie Getränke
  P: VEGAN         # Alkoholische Getränke
  R: VEGAN         # Gewürze, Würzmittel, Backzutaten
  # Q (Fette und Öle) has no default on purpose: it holds Rinderfett, Entenfett and Fischleberöl
  # next to olive and linseed oil, so all of its foods are decided below.

# Names that disagree with their group. These produce questions, never answers.
reviewPatterns:
  MEAT: "speck|schinken|fleisch|wurst|gelatine|schmalz|talg|brühe|bouillon|fond\\b|anchovis|sardell|lachs|fisch|krebs|hummer|garnele|muschel|aspik|leber|blut|geflügel|hühner|rinder|schweine|kalbs|lamm"
  VEGETARIAN: "butter|sahne|rahm|milch|käse|quark|joghurt|jogurt|molke|honig|kasein|laktose|\\bei(er|gelb|klar|weiß)?\\b|eihaltig"

# The only thing that settles a food. Every nomination above, every food of a group without a
# default, and every FDC food appears here with the description it was decided from.
