name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel superseded runs per ref, except on main where a cancelled run could
# abort an in-flight auto-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Only what every job needs. The jobs that write (publish-main, auto-release) raise their
# own ceiling, so a compromised step in one job cannot use another job's privileges.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    uses: ./.github/workflows/build-test.yml

  sonar:
    name: SonarCloud
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The scanner reads the pull request it is analysing. SonarCloud decorates the
      # pull request through its own GitHub app, not through this token.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Sonar analyses the Java sources only, so the admin panel bundle is not worth
      # the node download here.
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --batch-mode -DskipAdminUi verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=steve192_opencookbook-apiserver

  publish-main:
    name: Publish main image
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # build-test already ran the tests for this commit; this build only produces the jar.
      - name: Package
        run: mvn --batch-mode package -DskipTests

      - name: Build and push Docker image
        uses: ./.github/actions/publish-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

  renovate-release-check:
    name: Evaluate Renovate-only commits
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.evaluate.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine eligibility
        id: evaluate
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')
          if [ -z "$last_tag" ]; then
            echo "No previous release tag found. Skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$last_tag" HEAD; then
            :
          else
            echo "Last tag $last_tag not an ancestor of HEAD; skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_range="${last_tag}..HEAD"
          commit_list=$(git rev-list "$commit_range")
          if [ -z "$commit_list" ]; then
            echo "No commits since $last_tag. Skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_info=$(git log "$commit_range" --pretty='%an|%ae')
          should_release=true
          while IFS='|' read -r author email; do
            [ -z "$author" ] && continue
            lower=$(printf '%s %s' "$author" "$email" | tr '[:upper:]' '[:lower:]')
            if [[ "$lower" == *renovate* ]]; then
              continue
            fi
            echo "Found non-dependency-bot commit from $author <$email>. Release will be skipped."
            should_release=false
            break
          done <<< "$commit_info"

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  auto-release:
    name: Auto release
    needs: renovate-release-check
    if: needs.renovate-release-check.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      # The calling workflow IS the CI run that release.yml would otherwise
      # have to verify, so wait-on-yourself is impossible. See the
      # verify-default-branch-ci job in release.yml for details.
      skip_default_branch_ci_check: true
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      packages: write
    secrets: inherit
