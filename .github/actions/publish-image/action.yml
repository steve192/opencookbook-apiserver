name: Publish image
description: >-
  Build the Docker image from the jar in target/ and, unless told otherwise, push it under
  the given tags. The repository must already be checked out and the jar already built.

inputs:
  tags:
    description: Newline separated image tags to build.
    required: true
  push:
    description: Whether to push the image, or only build it to prove that it builds.
    required: false
    default: "true"
  token:
    description: >-
      Token to log into ghcr.io with. A composite action cannot read secrets itself, so the
      caller passes GITHUB_TOKEN. Only needed when pushing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Log into ghcr.io
      if: inputs.push == 'true'
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=app
        cache-to: type=gha,scope=app,mode=max
