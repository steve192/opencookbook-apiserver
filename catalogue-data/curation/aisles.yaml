# Where a food is sold, so a shopping list reads in the order a shop is walked.
# See scripts/cookpal_catalogue/catalogue/aisles.py.
#
# Decided in this order: an override, a processing state, a word in the source name, the BLS
# subgroup (the first two characters of the code). Variants take their base's aisle unless one of
# the first three moves them. A base none of these places stops the build.

