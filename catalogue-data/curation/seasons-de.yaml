# When fruit and vegetables come from German fields, covers, greenhouses or stores, per month.
# Read by feature_facts.py into seasonal.json, the seasonal calendar's dataset file.
#
# The months come from five German seasonal calendars (two articles for nuts): a month is listed when
# at least two of them show the food in it, with the growing methods at least two of them name, or else
# those of the most detailed calendar for that month.
#
# Methods: FIELD (open field), PROTECTED (fleece or foil, unheated), UNHEATED_GREENHOUSE (unheated or
# slightly heated greenhouse), HEATED_GREENHOUSE, STORED (stored harvest).

