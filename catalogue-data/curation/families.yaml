  - T204582  # Dorsch/Kabeljau, paniert, gebraten ohne Fett (Pfanne)
  - T900262  # Tintenfischringe paniert, tiefgefroren, gebacken (Ofen)
  - U171942  # Rind Bratenfleisch (Bug) mariniert, geschmort ohne Fett
