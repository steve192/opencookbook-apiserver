# BLS families: code characters 1-5; preparation: character 6. Where the build's family and name rules
# (catalogue/bls_foods.py) find no unprepared food for a prepared one, it is decided here.
#
# attach: a prepared food -> the code of the unprepared food it is a variant of.
attach:
  T420132: T422100  # Forelle pochiert -> Forelle roh
  T420152: T422100  # Forelle gedünstet
  T420162: T422100  # Forelle gebraten ohne Fett (Ofen)
  T420172: T422100  # Forelle gegrillt
  T420182: T422100  # Forelle gebraten ohne Fett (Pfanne)
  K130362: K130200  # Pommes frites tiefgefroren, gebacken, gesalzen -> Pommes frites tiefgefroren
  K130592: K130200  # Pommes frites tiefgefroren, frittiert, gesalzen

# bases: a prepared food that is a food of its own - bought or listed as such, with no unprepared
# counterpart in the BLS. Its family's other prepared members become its variants.
