# How fruit and vegetables keep at home, for the seasonal calendar's storage tips.
# Read by feature_facts.py into seasonal.json: the seasonal calendar shows it, so only foods with a season.
#
# What common storage advice agrees on; a place it disagrees on is left out (apples: cellar or fridge).
# place: FRIDGE (vegetable drawer, up to about 5 °C) or COOL_DARK (cool, dark, outside the fridge).
# coldSensitive: suffers in the cold, from about 7 °C down. ethyleneProducer: gives off ethylene.
# ethyleneSensitive: ripens or spoils faster near ethylene. Advice for root vegetables counts for each of them.

foods:
