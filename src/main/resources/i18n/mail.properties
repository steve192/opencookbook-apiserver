# English texts of every mail this instance sends. This file is also the fallback: a key that
# is missing from a translation is answered from here rather than left blank.
#
# Texts are addressed by key from the templates in mailtemplates/, so a wording change never
# means touching markup. Keys taking a {0} placeholder are formatted with MessageFormat, which
# means a literal single quote in them has to be written twice.

mail.app.name=CookPal
mail.app.tagline=Your recipes, your week, your kitchen.

mail.common.greeting=Hi there,
mail.common.buttonFallback=If the button does not work, copy this address into your browser:
mail.common.footer.automated=This mail was sent automatically. Replies to it are not read.
mail.common.footer.sentTo=Sent to {0}

mail.activation.subject=Confirm your CookPal account
mail.activation.preheader=One click and your kitchen is ready.
mail.activation.heading=Welcome to CookPal
mail.activation.intro=Your account is created. Confirm your address and you can start collecting recipes and planning your week straight away.
mail.activation.button=Confirm account
mail.activation.ignore=Did not sign up? Then somebody mistyped their address. Ignore this mail and no account will ever be activated.

mail.passwordReset.subject=Reset your CookPal password
mail.passwordReset.preheader=Choose a new password for your account.
mail.passwordReset.heading=Reset your password
mail.passwordReset.intro=We were asked to reset the password of your CookPal account. Pick a new one here:
mail.passwordReset.button=Set a new password
mail.passwordReset.validity=The link works for one hour and only once.
mail.passwordReset.ignore=Did not ask for this? Ignore this mail and your password stays exactly as it is.

mail.accountDeleted.subject=Your CookPal account was deleted
mail.accountDeleted.preheader=Your account and everything in it is gone.
mail.accountDeleted.heading=Your account was deleted
mail.accountDeleted.intro=Your CookPal account has been deleted. Every recipe, picture and weekplan that belonged to it was removed and cannot be brought back.
mail.accountDeleted.comeback=Sorry to see you go. You are welcome back whenever you like, a new account takes a moment.
mail.accountDeleted.button=Start again
