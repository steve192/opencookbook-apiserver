# Deutsche Texte aller Mails dieser Instanz. Fehlt ein Schlüssel hier, antwortet mail.properties.
#
# Die Datei wird als UTF-8 gelesen (MailConfiguration setzt das Encoding), Umlaute stehen also
# direkt darin. Schlüssel mit {0} laufen durch MessageFormat, ein echtes Hochkomma muss darin
# verdoppelt werden.

mail.app.name=CookPal
mail.app.tagline=Deine Rezepte, deine Woche, deine Küche.

mail.common.greeting=Hallo,
mail.common.buttonFallback=Falls der Button nicht funktioniert, kopiere diese Adresse in deinen Browser:
mail.common.footer.automated=Diese Mail wurde automatisch verschickt. Antworten darauf liest niemand.
mail.common.footer.sentTo=Gesendet an {0}

mail.activation.subject=Bestätige deinen CookPal Account
mail.activation.preheader=Ein Klick und deine Küche steht bereit.
mail.activation.heading=Willkommen bei CookPal
mail.activation.intro=Dein Account ist angelegt. Bestätige deine Adresse und du kannst sofort Rezepte sammeln und deine Woche planen.
mail.activation.button=Account bestätigen
mail.activation.ignore=Du hast dich gar nicht angemeldet? Dann hat sich jemand bei der Adresse vertippt. Ignoriere diese Mail einfach, dann wird nie ein Account aktiviert.

mail.passwordReset.subject=Setze dein CookPal Passwort zurück
mail.passwordReset.preheader=Wähle ein neues Passwort für deinen Account.
mail.passwordReset.heading=Passwort zurücksetzen
mail.passwordReset.intro=Wir wurden gebeten, das Passwort deines CookPal Accounts zurückzusetzen. Hier wählst du ein neues:
mail.passwordReset.button=Neues Passwort setzen
mail.passwordReset.validity=Der Link gilt eine Stunde und nur ein einziges Mal.
mail.passwordReset.ignore=Du hast das nicht angefordert? Ignoriere diese Mail, dein Passwort bleibt genau wie es ist.

mail.accountDeleted.subject=Dein CookPal Account wurde gelöscht
mail.accountDeleted.preheader=Dein Account und alles darin ist weg.
mail.accountDeleted.heading=Dein Account wurde gelöscht
mail.accountDeleted.intro=Dein CookPal Account wurde gelöscht. Alle Rezepte, Bilder und Wochenpläne, die dazu gehört haben, sind entfernt und lassen sich nicht wiederherstellen.
mail.accountDeleted.comeback=Schade, dass du gehst. Du bist jederzeit wieder willkommen, ein neuer Account ist schnell angelegt.
mail.accountDeleted.button=Neu anfangen
