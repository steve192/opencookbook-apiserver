spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cookpal
    username: cookpal
    password: changeme
  flyway:
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE_MB:10}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:30}MB
      enabled: true
  jpa:
    show-sql: false
springdoc:
    api-docs:
        enabled: true
        path: /api-docs/swagger-config
    swagger-ui:
        path: /api-docs
        display-request-duration: true
        display-query-params-without-oauth2: true
        disable-swagger-default-url: true
        supported-submit-methods:
opencookbook:
  # instanceURL: https://cookpal.io
  jwtSecret: default-jwt-secret
  uploadDir: recipe-images
  thumbnailDir: recipe-images/thumbnails
  # 10MB
  maxImageSize: 10485760 
  # 10 minutes
  jwtDuration: 600 
  # 1 year
  refreshTokenDuration: 31536000 
  recipeScaperServiceUrl: http://recipe-scrapers:9090
  ml:
    # Empty means this instance has no machine learning subsystem, and every feature that
    # would need one is absent rather than broken. That is the default.
    serviceUrl: ""
    apiToken: ""
    # Leave empty to derive it from the api token. See OpencookbookConfiguration.Ml.
    submitterSalt: ""
    connectTimeoutSeconds: 5
    requestTimeoutSeconds: 30
    pollIntervalSeconds: 2
    jobTimeoutSeconds: 300
    jobRetentionHours: 24
    recipeOcr:
      enabled: true
      jobsPerUserPerDay: 20
      maxPages: 6
server:
    # This is okay if we trust the direct caller of this service
    # This will be our own reverse proxy server
  forward-headers-strategy: framework
  error:
    # Disable trace in rest api
    include-stacktrace: never

---
# Profile used for local development
spring:
    config:
        activate:
            on-profile: default

    # Use when you want to db to be created without flyway (e.g. when you create new entities)
    # flyway:
    #   enabled: false
    # jpa.hibernate.ddl-auto: create-drop

    jpa.hibernate.ddl-auto: update
opencookbook:
  activate-users-after-signup: true
  # The expo web dev server, which is where /share/... is a route
  instanceURL: http://localhost:8081
  ml:
    # The subsystem's own compose stack, published on this port by its .env.
    #   cd ../cookpal-ml-subsystem && cp .env.example .env && docker compose up -d
    serviceUrl: http://localhost:8100
    # Issued once and shown once, so it never belongs in a tracked file. Take it from the
    # environment, or from config/application.yml which is git ignored - see
    # config/application.yml.example:
    #   docker compose exec ml-web python manage.py issue_token "local development"
    #   export ML_API_TOKEN=cpml_...
    # Left empty nothing is sent to the subsystem at all, which reads as "not available" and
    # takes recipe scanning out of the app rather than breaking it.
    apiToken: ${ML_API_TOKEN:}
    recipeOcr:
      # Generous locally: the limit is there to stop one person spending an
      # instance's allowance, and on this machine there is only one person.
      jobsPerUserPerDay: 200

